<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo — Landing Sederhana</title>
  <style>
    :root {
      --void: #08090a; --carbon: #0f1011; --graphite: #23252a;
      --mist: #d0d6e0; --ash: #62666d; --paper: #fff; --acid: #e4f222;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--void); color: var(--mist);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; padding: 40px;
    }
    h1 { color: var(--paper); font-size: 44px; font-weight: 510; letter-spacing: -0.022em; text-align: center; }
    p { color: var(--ash); max-width: 420px; text-align: center; line-height: 1.6; }
    .btn {
      background: var(--acid); color: var(--void); border: none;
      border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 510;
      cursor: pointer;
    }
    .frame {
      border: 1px solid var(--graphite); border-radius: 12px;
      background: var(--carbon); padding: 24px; margin-top: 12px;
      font-size: 13px; color: var(--ash);
    }
  </style>
</head>
<body>
  <h1>Landing Sederhana</h1>
  <p>Ini contoh desain HTML statis — satu file lengkap, CSS &amp; JS inline. Lo bisa upload desain kayak gini lewat tombol "+ Tambah Desain" di dashboard.</p>
  <button class="btn">Coba Sekarang</button>
  <div class="frame">↳ desain ini cuma demo. Bikin punya lo sendiri!</div>
  <script>
    document.querySelector('.btn').addEventListener('click', () => alert('Halo dari demo on-sight!'));
  </script>
</body>
</html>
